# Local dev: Postgres + the two backend services. Frontend runs via `npm run dev` (Vercel in prod).
# Firebase Auth/Storage use the Google emulators locally — TODO: add firebase-tools emulator.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vira_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-vira}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    depends_on:
      - postgres
      - ai-service
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-vira};Username=${POSTGRES_USER:-vira};Password=${POSTGRES_PASSWORD:-vira_local_dev}
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "8080:8080"

volumes:
  pgdata:
